<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AI 文案生成 - 灵犀工具箱</title><link rel="stylesheet" href="../style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a href="/" class="logo">🧠 灵犀工具箱</a><div class="nav-links"><a href="../index.html">首页</a></div></div></nav><div class="tool-page"><a href="../index.html" class="back-link">← 返回首页</a><h1>✍️ AI 文案生成</h1><p class="subtitle">输入主题关键词，一键生成各种风格的文案</p><div class="tool-workspace"><label style="font-weight:600;display:block;margin-bottom:8px;">文案主题</label><input type="text" id="topic" placeholder="例如：新开的奶茶店搞活动……" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:15px;margin-bottom:16px;"><label style="font-weight:600;display:block;margin-bottom:8px;">文案风格</label><select id="style" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:15px;margin-bottom:16px;"><option value="小红书">📕 小红书种草风</option><option value="朋友圈">💬 朋友圈分享风</option><option value="抖音">🎵 短视频脚本风</option><option value="公众号">📰 公众号文章风</option><option value="促销">🛒 促销广告风</option></select><div class="btn-row"><button class="btn btn-primary-btn" onclick="generate()">✨ 生成文案</button><button class="btn btn-secondary" onclick="copyResult()">📋 一键复制</button></div><div class="result-box" id="result">点击「生成文案」按钮查看效果……</div></div></div><script>function generate(){const t=document.getElementById('topic').value||'未指定主题',s=document.getElementById('style').value;const T={'小红书':`🌟 ${t} | 绝绝子体验分享！\n\n哈喽宝子们～\n\n✨ 第一眼就被吸引了\n💯 体验感直接拉满\n📸 随手一拍就是大片\n🔥 已经安利给身边所有朋友\n\n真的良心推荐，宝子们冲就完了！🏃‍♀️\n\n#${t.replace(/\s/g,'')} #种草 #好物分享`,'朋友圈':`📍 ${t}\n\n今日份快乐已送达 ✨\n\n没想到 ${t} 这么让人惊喜\n忍不住想跟大家分享一下 😆\n\n生活嘛，就是要去体验新事物\n今天又是被治愈的一天～`,'抖音':`🎬 【爆款短视频脚本】\n\n📌 主题：${t}\n\n🎯 开头（0-3秒）：\n"你敢信吗？${t} 居然……"\n\n📖 中间（3-30秒）：\n1. 展示问题\n2. 对比体验\n3. 高光时刻\n\n🎤 结尾："赶紧@你的好友！"\n\n🎵 推荐BGM：轻松欢快\n💡 建议时长：40秒`,'公众号':`📰 ${t} | 一个你不得不知道的新发现\n\n大家好，我是灵犀。\n\n最近发现了一个关于 ${t} 的秘密。\n\n说实话一开始没抱期望。但真正体验后……\n\n它最吸引人的地方在于细节。\n\n如果你也在找类似的东西，不妨一试。\n\n↓↓↓ 点赞支持 ↓↓↓`,'促销':`🎉 重磅福利！${t}\n\n🔥 全场低至 5 折 🔥\n\n✅ 限时福利 | 错过等一年\n✅ 品质保证 | 不满意包退\n\n📅 活动时间：即日起至月底\n\n#${t.replace(/\s/g,'')} #优惠活动`};document.getElementById('result').textContent=T[s]||T['小红书']}function copyResult(){navigator.clipboard.writeText(document.getElementById('result').textContent).then(()=>alert('已复制到剪贴板！'))}</script></body></html>
