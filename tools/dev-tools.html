<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>开发工具 - 灵犀工具箱</title><link rel="stylesheet" href="../style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a href="/" class="logo">🧠 灵犀工具箱</a><div class="nav-links"><a href="../index.html">首页</a></div></div></nav><div class="tool-page"><a href="../index.html" class="back-link">← 返回首页</a><h1>🔢 开发小工具</h1><p class="subtitle">程序员日常必备：格式化、编解码、生成器</p><div class="tool-workspace"><h3 style="margin-bottom:12px">JSON 格式化 / 压缩</h3><textarea id="jsonInput" placeholder='{"name":"灵犀"}' style="min-height:120px"></textarea><div class="btn-row"><button class="btn btn-primary-btn" onclick="formatJSON()">🎨 格式化</button><button class="btn btn-secondary" onclick="compressJSON()">📦 压缩</button><button class="btn btn-secondary" onclick="copyJSON()">📋 复制</button></div><div class="result-box" id="jsonResult">等待输入……</div></div><div class="tool-workspace"><h3 style="margin-bottom:12px">Base64 编解码</h3><textarea id="base64Input" placeholder="输入文本……" style="min-height:80px"></textarea><div class="btn-row"><button class="btn btn-primary-btn" onclick="base64Encode()">🔒 Base64 编码</button><button class="btn btn-secondary" onclick="base64Decode()">🔓 Base64 解码</button></div><div class="result-box" id="base64Result">等待输入……</div></div><div class="tool-workspace"><h3 style="margin-bottom:12px">时间戳转换</h3><input type="number" id="timestampInput" placeholder="输入 Unix 时间戳（秒）" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:15px;margin-bottom:8px;"><div class="btn-row"><button class="btn btn-primary-btn" onclick="convertTimestamp()">🕐 转换</button><button class="btn btn-secondary" onclick="currentTimestamp()">📍 当前时间戳</button></div><div class="result-box" id="timestampResult">等待输入……</div></div><div class="tool-workspace"><h3 style="margin-bottom:12px">二维码生成</h3><input type="text" id="qrText" placeholder="输入文字或链接" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:15px;margin-bottom:8px;"><button class="btn btn-primary-btn" onclick="generateQR()">📱 生成二维码</button><div id="qrResult" style="margin-top:16px;text-align:center;"></div></div></div><script>function formatJSON(){try{const o=JSON.parse(document.getElementById('jsonInput').value);document.getElementById('jsonResult').textContent=JSON.stringify(o,null,2)}catch(e){document.getElementById('jsonResult').textContent='❌ JSON 格式错误：'+e.message}}function compressJSON(){try{const o=JSON.parse(document.getElementById('jsonInput').value);document.getElementById('jsonResult').textContent=JSON.stringify(o)}catch(e){document.getElementById('jsonResult').textContent='❌ JSON 格式错误：'+e.message}}function copyJSON(){navigator.clipboard.writeText(document.getElementById('jsonResult').textContent).then(()=>alert('已复制！'))}function base64Encode(){try{document.getElementById('base64Result').textContent=btoa(unescape(encodeURIComponent(document.getElementById('base64Input').value)))}catch(e){document.getElementById('base64Result').textContent='编码失败'}}function base64Decode(){try{document.getElementById('base64Result').textContent=decodeURIComponent(escape(atob(document.getElementById('base64Input').value)))}catch(e){document.getElementById('base64Result').textContent='解码失败，请检查输入'}}function convertTimestamp(){const ts=parseInt(document.getElementById('timestampInput').value);const d=new Date(ts*1000);document.getElementById('timestampResult').textContent=d.toLocaleString('zh-CN')+'\nISO: '+d.toISOString()}function currentTimestamp(){document.getElementById('timestampInput').value=Math.floor(Date.now()/1000);convertTimestamp()}function generateQR(){const text=document.getElementById('qrText').value||'https://lingxi.tools';document.getElementById('qrResult').innerHTML='<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(text)+'" alt="QR" style="border:1px solid #e2e8f0;border-radius:8px;"><p style="margin-top:8px;color:#64748b;">'+text+'</p>'}</script></body></html>
