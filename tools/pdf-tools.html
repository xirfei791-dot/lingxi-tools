<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PDF 工具 - 灵犀工具箱</title><link rel="stylesheet" href="../style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a href="/" class="logo">🧠 灵犀工具箱</a><div class="nav-links"><a href="../index.html">首页</a></div></div></nav><div class="tool-page"><a href="../index.html" class="back-link">← 返回首页</a><h1>📄 PDF 工具</h1><p class="subtitle">PDF 查看、合并、拆分——全部在浏览器本地处理</p><div class="tool-workspace"><input type="file" accept=".pdf" id="pdfFile" style="margin:16px 0;"><div id="pdfPreview" style="margin-top:16px;"></div></div></div><script>document.getElementById('pdfFile').addEventListener('change',function(e){const file=e.target.files[0];if(file){const url=URL.createObjectURL(file);document.getElementById('pdfPreview').innerHTML='<p style="margin-bottom:12px;">📄 '+file.name+'（'+(file.size/1024).toFixed(1)+' KB）</p><embed src="'+url+'" type="application/pdf" width="100%" height="500px">'}})</script></body></html>
