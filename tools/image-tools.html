<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>图片处理 - 灵犀工具箱</title><link rel="stylesheet" href="../style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a href="/" class="logo">🧠 灵犀工具箱</a><div class="nav-links"><a href="../index.html">首页</a></div></div></nav><div class="tool-page"><a href="../index.html" class="back-link">← 返回首页</a><h1>🖼️ 图片处理</h1><p class="subtitle">压缩、裁剪、格式转换，全部在浏览器完成</p><div class="tool-workspace"><h3 style="margin-bottom:12px">图片压缩</h3><input type="file" accept="image/*" id="imgFile" style="margin-bottom:16px;"><div style="margin-bottom:12px;"><label>压缩质量：</label><input type="range" id="quality" min="10" max="100" value="80" style="width:200px;"><span id="qualityVal">80%</span></div><div class="btn-row"><button class="btn btn-primary-btn" onclick="compressImage()">🗜️ 压缩图片</button><button class="btn btn-secondary" onclick="downloadImage()">💾 下载</button></div><div id="imgPreview" style="margin-top:16px;text-align:center;"></div><p id="imgInfo" style="color:var(--text-light);font-size:13px;margin-top:8px;"></p></div></div><script>let compressedBlob=null,originalFileName='';document.getElementById('quality').addEventListener('input',function(){document.getElementById('qualityVal').textContent=this.value+'%'});document.getElementById('imgFile').addEventListener('change',function(e){const file=e.target.files[0];if(file){originalFileName=file.name;const reader=new FileReader();reader.onload=function(ev){document.getElementById('imgPreview').innerHTML='<img src="'+ev.target.result+'" style="max-width:100%;max-height:300px;border-radius:8px;">';document.getElementById('imgInfo').textContent='原图：'+(file.size/1024).toFixed(1)+' KB'};reader.readAsDataURL(file)}});function compressImage(){const img=document.querySelector('#imgPreview img');if(!img)return alert('请先选择图片');const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0);const quality=document.getElementById('quality').value/100;canvas.toBlob(blob=>{compressedBlob=blob;const url=URL.createObjectURL(blob);document.getElementById('imgPreview').innerHTML='<img src="'+url+'" style="max-width:100%;max-height:300px;border-radius:8px;">';document.getElementById('imgInfo').textContent='压缩后：'+(blob.size/1024).toFixed(1)+' KB（质量 '+Math.round(quality*100)+'%）'},'image/jpeg',quality)}function downloadImage(){if(!compressedBlob)return alert('请先压缩图片');const a=document.createElement('a');a.href=URL.createObjectURL(compressedBlob);a.download='compressed_'+originalFileName;a.click()}</script></body></html>
