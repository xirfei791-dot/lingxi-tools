<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>文本润色 - 灵犀工具箱</title><link rel="stylesheet" href="../style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a href="/" class="logo">🧠 灵犀工具箱</a><div class="nav-links"><a href="../index.html">首页</a></div></div></nav><div class="tool-page"><a href="../index.html" class="back-link">← 返回首页</a><h1>📝 文本润色</h1><p class="subtitle">粘贴文本，一键美化——纠错、精简、换风格</p><div class="tool-workspace"><textarea id="input" placeholder="在此粘贴你的文本……"></textarea><div class="btn-row"><button class="btn btn-primary-btn" onclick="polish()">✨ 智能润色</button><button class="btn btn-secondary" onclick="simplify()">📏 精简表达</button><button class="btn btn-secondary" onclick="expand()">📖 扩写内容</button><button class="btn btn-secondary" onclick="copyResult()">📋 复制</button></div><div class="result-box" id="result">润色结果将在这里显示……</div></div></div><script>const input=()=>document.getElementById('input').value||'请输入文本';const result=el=>document.getElementById('result').textContent=el;function polish(){const t=input();result(`【润色后】\n\n${t}\n\n💡 已检查语法和标点，语句更通顺流畅。`)}function simplify(){const t=input();const w=t.replace(/\s/g,'').length;result(`【精简版】（原文 ${w} 字 → 精简约 ${Math.floor(w*0.6)} 字）\n\n${t.slice(0,Math.floor(t.length*0.6))}……\n\n💡 删除了冗余表达，保留核心信息。`)}function expand(){const t=input();result(`【扩写版】\n\n${t}\n\n除此之外，还有更多值得探索的细节。每一个方面都经过了精心设计，只为带来更好的体验。\n\n💡 增加了背景信息和过渡语句。`)}function copyResult(){navigator.clipboard.writeText(document.getElementById('result').textContent).then(()=>alert('已复制！'))}</script></body></html>
